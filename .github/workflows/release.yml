name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Package standalone Python engine sidecar
        run: uv run python packaging/build_sidecar.py

      - name: Build Windows NSIS installer and portable package
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows_app.ps1 -SkipSidecarBuild

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/dist/SHA256SUMS.txt")) {
            throw "Release manifest SHA256SUMS.txt was not generated."
          }
          Get-Content "packaging/dist/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenLargePrint ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            packaging/dist/OpenLargePrint_*_x64-setup.exe
            packaging/dist/OpenLargePrint_*_windows_x64_portable.zip
            packaging/dist/SHA256SUMS.txt
