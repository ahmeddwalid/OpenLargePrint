name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --locked --dev --extra dev --python 3.12

      - name: Install Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci
        working-directory: ui

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Validate engine and frontend
        run: |
          uv run pytest tests/ -q
          npm --prefix ui test -- --run
      - name: Package standalone Python engine sidecar
        run: uv run python packaging/build_sidecar.py

      - name: Smoke-test packaged engine
        shell: pwsh
        run: |
          '{"command":"health"}' | & .\src-tauri\binaries\openlargeprint-sidecar-x86_64-pc-windows-msvc.exe sidecar
          if ($LASTEXITCODE -ne 0) { throw "Packaged engine failed" }
      - name: Build Windows NSIS installer and portable package
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows_app.ps1 -SkipSidecarBuild

      # Windows 11 Smart App Control blocks unsigned executables outright. This gate
      # inspects the real Authenticode state of what is about to be published.
      # It becomes mandatory the moment signing is configured (see SIGNING.md).
      - name: Verify Windows signatures (Smart App Control gate)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: pwsh
        run: |
          $artifacts = @()
          $artifacts += Get-ChildItem "packaging/dist/OpenLargePrint_*_x64-setup.exe" | Select-Object -ExpandProperty FullName
          $artifacts += (Resolve-Path "src-tauri/target/release/openlargeprint-desktop.exe").Path
          $artifacts += (Resolve-Path "src-tauri/binaries/openlargeprint-sidecar-x86_64-pc-windows-msvc.exe").Path
          powershell -ExecutionPolicy Bypass -File packaging/verify_signatures.ps1 `
            -Path $artifacts -ExpectedPublisherMatch "SignPath Foundation"

      - name: Flag unsigned artifacts
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
        shell: pwsh
        run: |
          Write-Warning "No code signing is configured. Smart App Control on Windows 11 will block these artifacts for end users. See SIGNING.md section 3."

      - name: Verify release artifacts exist
        shell: pwsh
        run: |
          if (-not (Test-Path "packaging/dist/SHA256SUMS.txt")) {
            throw "Release manifest SHA256SUMS.txt was not generated."
          }
          Get-Content "packaging/dist/SHA256SUMS.txt"

      # A versioned installer name breaks every "latest download" link as soon as the
      # version changes, so publish a stable-named copy for the README button. It is the
      # same bytes as the versioned installer, so it carries the same SHA-256 entry.
      - name: Publish stable-named installer copy
        shell: pwsh
        run: |
          $installer = Get-ChildItem "packaging/dist/OpenLargePrint_*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer was produced." }
          $stable = "packaging/dist/OpenLargePrint-Setup-x64.exe"
          Copy-Item -LiteralPath $installer.FullName -Destination $stable -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $stable).Hash.ToLowerInvariant()
          $sums = "packaging/dist/SHA256SUMS.txt"
          $existing = (Get-Content $sums -Raw).TrimEnd("`r", "`n")
          Set-Content $sums -Value ($existing + "`r`n" + ("{0}  OpenLargePrint-Setup-x64.exe" -f $hash)) -Encoding ascii
          Write-Host ("Stable download name ready: {0}" -f $stable)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenLargePrint ${{ github.ref_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            packaging/dist/OpenLargePrint-Setup-x64.exe
            packaging/dist/OpenLargePrint_*_x64-setup.exe
            packaging/dist/OpenLargePrint_*_windows_x64_portable.zip
            packaging/dist/SHA256SUMS.txt

  build-linux:
    name: Build Linux x86_64 packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install and validate
        run: |
          uv sync --locked --dev --extra dev --python 3.12
          npm --prefix ui ci
          uv run pytest tests/ -q
          npm --prefix ui test -- --run
      - name: Package engine
        run: uv run python packaging/build_sidecar.py
      - name: Smoke-test packaged engine
        run: |
          printf '%s\n' '{"command":"health"}' | src-tauri/binaries/openlargeprint-sidecar-x86_64-unknown-linux-gnu sidecar
      - name: Build Linux bundles
        working-directory: src-tauri
        run: npx -y @tauri-apps/cli@2 build --bundles deb,rpm,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: openlargeprint-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
