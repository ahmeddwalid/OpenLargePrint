name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# SEC-009: Verify no network traffic during conversion
# QA-001..003: Run full test suite on every PR

jobs:
  python-tests:
    name: Python Engine Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked --dev --extra dev --python ${{ matrix.python-version }}
      - name: Run pytest with coverage
        run: uv run pytest tests/ --cov=openlargeprint --cov-report=xml -v
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend-check:
    name: Frontend TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Type-check and build
        run: npm run build
        working-directory: ui

  rust-check:
    name: Rust Tauri Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Cargo check
        run: cargo check
        working-directory: src-tauri
      - name: Cargo clippy
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

  sbom-validation:
    name: SBOM License Inventory Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --dev --extra dev --python 3.12
      - name: Validate SBOM against dependencies
        run: uv run pytest tests/test_license_sbom.py -v

  zero-network:
    name: Offline Zero-Network Verification (SEC-009)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --locked --dev --extra dev --python 3.12
      - name: Verify standard conversion emits zero network traffic
        run: uv run pytest tests/test_security_hardening.py::test_offline_conversion_network_isolation -v

  frontend-tests:
    name: Frontend Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Run component tests
        run: npm test -- --run
        working-directory: ui
