[project]
name = "openlargeprint"
version = "0.2.0"
description = "Accessible, structure-preserving document reconstruction and large-print conversion engine"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "OpenLargePrint Contributors" }
]
dependencies = [
    "pydantic>=2.0.0",
    "pypdfium2>=4.30.0",
    "pikepdf>=8.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "rapidocr-onnxruntime==1.4.4",
    "opencv-python-headless>=4.8.0",
    "reportlab>=4.0.0",
    "arabic-reshaper>=3.0.1",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
openlargeprint = "openlargeprint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openlargeprint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
