[package]
name = "openlargeprint-desktop"
version = "0.3.1"
description = "OpenLargePrint Accessible Document Desktop Shell"
authors = ["OpenLargePrint Contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2"
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
